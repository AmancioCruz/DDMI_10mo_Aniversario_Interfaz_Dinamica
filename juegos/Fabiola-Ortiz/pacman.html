<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man | DDMI</title>
    <link rel="preload" href="../../recursos/tipografias/PPNeueBit-Bold.otf" as="font" type="font/otf" crossorigin>
    <link rel="preload" href="../../recursos/tipografias/PPMondwest-Regular.otf" as="font" type="font/otf" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/estilos.css">
    
</head>

<body>
    <header class="encabezado">
        <a class="marca" href="../../index.html">
            <img class="icono" src="../../recursos/identidad/simbolo-decimo-aniversario-ddmi.png" alt="">
            <span class="marca-texto">
                <strong>DDMI</strong>
                <small>DDMI — Décimo Aniversario</small>
            </span>
        </a>

        <nav class="navegacion">
            <ul class="menu">
                <li><a href="../../index.html">Inicio</a></li>
                <li><a href="../../catalogo.html">Catálogo</a></li>
            </ul>
        </nav>
    </header>

    <section class="estado-juego" aria-label="Estado del juego">
        <p><i class="fa-solid fa-signal"></i> Status: Activo</p>
        <p><i class="fa-solid fa-star"></i> Score: <span id="valor-puntaje">0</span></p>
        <p><i class="fa-solid fa-heart"></i> Vida: <span id="vida-jugador">3</span></p>
    </section>

    <main class="escenario">
        <aside class="panel-juego">
            <p class="etiqueta-panel">Nivel 01</p>
            <h1>Pac-Man</h1>
            <p>
                Come todos los puntos, evita a los fantasmas
                y consigue la mayor puntuación posible.
            </p>

            <ul class="controles-juego">
                <li><i class="fa-solid fa-arrow-up"></i> Mover arriba</li>
                <li><i class="fa-solid fa-arrow-down"></i> Mover abajo</li>
                <li><i class="fa-solid fa-arrow-left"></i> Mover izquierda</li>
                <li><i class="fa-solid fa-arrow-right"></i> Mover derecha</li>
                <li><i class="fa-solid fa-circle"></i> Come todos los puntos</li>
            </ul>

            <button class="boton-hud" type="button" id="reiniciar-juego">
                <i class="fa-solid fa-play"></i>
                <span>Iniciar</span>
            </button>
        </aside>

        <section class="marco-canvas" aria-label="Area de juego">
            <canvas id="canvas" width="1000" height="600"></canvas>
        </section>
    </main>

   <audio id="musica-fondo" loop>
        <source src="pacman.mp3" type="audio/mpeg">
    </audio>

    <script src="js/pacman.js"></script>
</body>

</html>

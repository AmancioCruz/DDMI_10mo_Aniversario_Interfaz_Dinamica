<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Break arc</title>

    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

    <div class="contenedor">

        <h1 class="titulo">
            Break arc
        </h1>

        <div class="hud">

            <div class="score">
                SCORE: <span id="score">0</span>
            </div>

            <div class="vidas">
                VIDAS: <span id="vidas">3</span>
            </div>

        </div>

        <canvas
            id="gameCanvas"
            width="1280"
            height="720">
        </canvas>
        <input type="file" id="inputNave" accept="image/png, image/jpeg">
        <button id="btnStart">
            START GAME
        </button>

    </div>

    <script src="js/game.js"></script>

</body>

</html>

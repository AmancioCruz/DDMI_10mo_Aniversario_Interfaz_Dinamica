<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Break arc</title>

    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

    <div class="contenedor">

        <h1 class="titulo">
            Break arc
        </h1>

        <div class="hud">

            <div class="score">
                SCORE: <span id="score">0</span>
            </div>

            <div class="vidas">
                VIDAS: <span id="vidas">3</span>
            </div>

        </div>

        <canvas
            id="gameCanvas"
            width="1280"
            height="720">
        </canvas>
        <div class="controles-touch">

    <button id="btnIzquierda">
        ⬅
    </button>

    <button id="btnDerecha">
        ➡
    </button>

</div>
        <label class="input-nave">

    SUBIR NAVE

    <input
        type="file"
        id="inputNave"
        accept="image/png, image/jpeg"
    >

</label>
        <button id="btnStart">
            START GAME
        </button>
        <div class="panel-reglas">

    <h2>
        REGLAS DEL JUEGO
    </h2>

    <ul>
        <li>
            Carga tu Nave en formato png o jpeg
        </li>

        <li>
            Mueve la nave con las flechas ← →
        </li>

        <li>
            Destruye todos los ladrillos para ganar
        </li>

        <li>
            Los ladrillos rojos resisten más golpes
        </li>

        <li>
            Tienes 3 vidas
        </li>

        <li>
            Si la pelota cae pierdes una vida
        </li>

    </ul>

</div>

    </div>

<script type="module" src="js/game.js"></script>
</body>

</html>
